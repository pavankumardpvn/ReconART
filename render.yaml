services:
  - type: web
    name: recon-art-api
    runtime: docker
    dockerfilePath: ./Dockerfile.backend
    dockerContext: .
    healthCheckPath: /api/v1/health/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: recon-art-db
          property: connectionURI
      - key: REDIS_URL
        fromService:
          name: recon-art-redis
          type: redis
          property: connectionURI
      - key: STORAGE_BACKEND
        value: s3
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false

  - type: web
    name: recon-art-frontend
    runtime: docker
    dockerfilePath: ./Dockerfile.frontend
    dockerContext: .

  - type: worker
    name: recon-art-celery
    runtime: docker
    dockerfilePath: ./Dockerfile.backend
    dockerContext: .
    dockerCommand: celery -A app.celery_app worker --loglevel=info
    envVars:
      - key: STORAGE_BACKEND
        value: s3
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false

databases:
  - name: recon-art-db
    databaseName: reconart
    plan: free

  - name: recon-art-redis
    type: redis
    plan: free
